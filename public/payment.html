<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#14161b;color:#ece9e1;font:15px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px}a{color:#f0a93b}.panel{background:#1b1e25;border:1px solid #2b2f3a;border-radius:12px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}select,input,button{width:100%;padding:11px;border-radius:7px;border:1px solid #3a3f4b;background:#20232b;color:#ece9e1;margin-top:7px}button{background:#f0a93b;color:#18120a;font-weight:800;cursor:pointer}.qr{max-width:260px;width:100%;display:block;margin:16px auto}.muted{color:#9ca3b0}.countdown{font:700 20px monospace;color:#ffbd75}.hidden{display:none}.error{color:#ff9c91}</style></head><body><main class="wrap"><a href="/index.html">กลับหน้าแชท</a><h1>ชำระเงินและเติม model</h1><p class="muted">ซื้อ plan หรือเติมเครดิตให้ model ใดก็ได้ สิทธิ์ model ที่ซื้อจะใช้ได้โดยไม่ขึ้นกับ plan</p><section class="panel"><h2>สร้างรายการ</h2><select id="kind"><option value="token">Top-up model</option><option value="tier">Plan</option></select><div id="tokenFields"><select id="model"></select><div class="grid"><input id="inputTokens" type="number" min="0" value="100000" placeholder="Input tokens"><input id="outputTokens" type="number" min="0" value="100000" placeholder="Output tokens"></div></div><select id="tier" class="hidden"><option value="plus">Plus - 299 THB/month</option><option value="max">Max - 499 THB/month</option></select><button id="create">สร้าง QR</button><div id="message" class="muted"></div></section><section id="paymentBox" class="panel hidden"><img id="qr" class="qr" alt="PromptPay QR"><b id="amount"></b><p id="notice"></p><div>QR หมดอายุใน <span id="countdown" class="countdown"></span></div><input id="slip" type="file" accept="image/*"><button id="upload">ส่งสลิปให้ Admin</button><div id="uploadStatus" class="muted"></div></section></main><script>
const key=localStorage.getItem('claudeProxyApiKey');if(!key)location.href='/login.html';const headers={'x-api-key':key,'Content-Type':'application/json'};let catalog=[],orderExpires=0,timer;
const $=id=>document.getElementById(id);function setMessage(t,c='muted'){$('message').textContent=t;$('message').className=c}function renderTimer(){const left=Math.max(0,orderExpires-Date.now());$('countdown').textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;$('upload').disabled=!left;if(!left){$('uploadStatus').textContent='QR หมดอายุแล้ว กรุณาสร้างรายการใหม่';clearInterval(timer)}}
async function init(){const r=await fetch('/v1/catalog',{headers:{'x-api-key':key}});const d=await r.json();catalog=Object.entries(d.providers).flatMap(([provider,p])=>p.models.map(m=>({...m,provider})));$('model').innerHTML=catalog.filter(m=>m.tier!=='free').map((m,i)=>`<option value="${i}">[${m.tier.toUpperCase()}] ${m.label} — ${m.provider}</option>`).join('');const params=new URLSearchParams(location.search);if(params.get('kind')==='tier'){$('kind').value='tier';$('tier').value=params.get('tier')||'plus';$('kind').onchange()}}
$('kind').onchange=()=>{$('tokenFields').classList.toggle('hidden',$('kind').value!=='token');$('tier').classList.toggle('hidden',$('kind').value!=='tier')};$('create').onclick=async()=>{const body=$('kind').value==='tier'?{tier:$('tier').value}:{provider:catalog.filter(m=>m.tier!=='free')[$('model').value]?.provider,model:catalog.filter(m=>m.tier!=='free')[$('model').value]?.id,inputTokens:+$('inputTokens').value,outputTokens:+$('outputTokens').value};const r=await fetch('/v1/checkout',{method:'POST',headers,body:JSON.stringify(body)}),d=await r.json();if(!r.ok){setMessage(d.error,'error');return}setMessage('สร้างรายการแล้ว');$('paymentBox').classList.remove('hidden');$('qr').src=d.qrDataUrl;$('amount').textContent=`ยอดชำระ ฿${d.amountThb} · ${d.tokens?d.tokens.toLocaleString()+' tokens':''}`;$('notice').textContent=d.notice;orderExpires=new Date(d.expiresAt).getTime();$('upload').dataset.orderId=d.orderId;clearInterval(timer);renderTimer();timer=setInterval(renderTimer,1000)};
$('upload').onclick=async()=>{const file=$('slip').files[0],id=$('upload').dataset.orderId;if(!file){$('uploadStatus').textContent='กรุณาเลือกสลิป';return}const form=new FormData();form.append('slip',file);const r=await fetch('/v1/orders/'+id+'/slip',{method:'POST',headers:{'x-api-key':key},body:form}),d=await r.json();$('uploadStatus').textContent=r.ok?'ส่งสลิปแล้ว รอ Admin อนุมัติ':d.error||'ส่งสลิปไม่สำเร็จ'};init().catch(e=>setMessage(e.message,'error'));
</script></body></html>
