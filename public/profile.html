<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #14161b; color: #ece9e1; font: 15px system-ui, sans-serif; }
    .wrap { max-width: 1080px; margin: auto; padding: 28px; }
    a { color: #f0a93b; }
    .hero { display: flex; gap: 14px; align-items: center; margin: 24px 0; }
    .avatar { width: 58px; height: 58px; border-radius: 18px; background: #292d35; color: #f0a93b; display: grid; place-items: center; font: 700 25px monospace; }
    .muted { color: #8a8f9c; }
    h1, h2 { margin: 0 0 10px; }
    .features { flex: 1; line-height: 1.75; color: #c9ced8; }
    .wallet { display:none; margin:0 0 20px; padding:16px; background:#1b1e25; border:1px solid #2b2f3a; border-radius:12px; }
    .wallet.show { display:block; }
    .wallet-head { display:flex; justify-content:space-between; gap:12px; font-family:monospace; font-size:12px; }
    .wallet-track { height:10px; margin-top:10px; background:#30353f; border-radius:999px; overflow:hidden; }
    .wallet-fill { height:100%; width:0; background:#5fbf87; transition:width .3s ease; }
    .profile-form,.usage-limit { max-width:520px; background:#1b1e25; border:1px solid #2b2f3a; border-radius:12px; padding:16px; margin-bottom:20px; }
    .profile-form input { display:block; width:100%; margin:7px 0 12px; padding:10px; background:#20232b; border:1px solid #2b2f3a; color:#ece9e1; border-radius:6px; }
    .usage-track { height:10px; background:#30353f; border-radius:99px; overflow:hidden; margin:7px 0 14px; }.usage-fill { height:100%; width:0; background:#f0a93b; }
    button { background: #f0a93b; border: 0; border-radius: 8px; padding: 11px 14px; font-weight: 800; cursor: pointer; }
    button:disabled { background: #30353f; color: #9ca3b0; cursor: default; }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="/index.html">Back to chat</a>
    <section class="hero">
      <div id="avatar" class="avatar">?</div>
      <div>
        <h1 id="name">Loading account...</h1>
        <div id="status" class="muted"></div>
      </div>
    </section>
    <section class="wallet" id="wallet"><div class="wallet-head"><b>เครดิต token คงเหลือ</b><span id="walletText"></span></div><div class="wallet-track"><div class="wallet-fill" id="walletFill"></div></div><p class="muted" id="walletNotice"></p><a href="/usage.html">เติม token ตาม model</a></section>
    <section class="profile-form"><h2>ข้อมูลบัญชี</h2><p class="muted" id="accountNotice"></p><label>Email</label><input id="emailInput" type="email" placeholder="กรอก email"><h3>เปลี่ยน password</h3><input id="currentPassword" type="password" placeholder="Password ปัจจุบัน"><input id="newPassword" type="password" placeholder="Password ใหม่ อย่างน้อย 8 ตัวอักษร"><input id="newPasswordConfirm" type="password" placeholder="ยืนยัน Password ใหม่"><button id="saveProfile" type="button">บันทึกข้อมูล</button><div id="profileStatus" class="muted"></div></section>
    <section class="usage-limit"><h2>Usage limit</h2><div>Daily: <span id="dailyUsage">กำลังโหลด...</span></div><div class="usage-track"><div class="usage-fill" id="dailyFill"></div></div><div>Monthly: <span id="monthlyUsage">กำลังโหลด...</span></div><div class="usage-track"><div class="usage-fill" id="monthlyFill"></div></div></section>
    <section class="usage-limit"><h2>เครดิตแยกตาม model</h2><div id="modelTokens" class="muted">กำลังโหลด...</div></section>
    <p><a href="/plans.html">ดู Plans และอัปเกรด plan</a> · <a href="/payment.html">เติม model ผ่าน Top-up</a></p>
  </main>
  <script>
    const apiKey = localStorage.getItem('claudeProxyApiKey');
    const nameElement = document.getElementById('name');
    const avatarElement = document.getElementById('avatar');
    const statusElement = document.getElementById('status');

    if (!apiKey) window.location.href = '/login.html';

    const headers = { 'x-api-key': apiKey, 'Content-Type': 'application/json' };

    async function init() {
      const response = await fetch('/v1/profile', { headers });
      const profile = await response.json();
      if (!response.ok) throw new Error(profile.error || 'Unable to load profile');
      const currentTier = profile.tier || 'free';
      const displayName = profile.name || 'User';
      nameElement.textContent = displayName;
      avatarElement.textContent = displayName[0].toUpperCase();
      statusElement.textContent = `Current plan: ${currentTier.toUpperCase()}`;
      document.getElementById('emailInput').value = profile.email || '';
      document.getElementById('accountNotice').textContent = profile.email ? '' : 'บัญชีเดิมยังไม่มี email กรุณากรอก email เพื่อให้ข้อมูลบัญชีครบถ้วน';
      const balance = Number(profile.tokenBalance || 0);
      const limit = Number(profile.tokenPlanLimit || 0);
      const tokenRows = profile.modelTokens || [];
      document.getElementById('modelTokens').innerHTML = tokenRows.length ? tokenRows.map(row => `<div style="display:flex;justify-content:space-between;gap:12px;margin:8px 0"><span>${row.provider}/${row.model}</span><b>${row.tokens.toLocaleString()} · ${row.source === 'offer' ? 'Offer' : 'Top-up'}</b></div>`).join('') : 'ยังไม่มี token จาก Offer หรือ Top-up';
      if (limit > 0) {
        document.getElementById('wallet').classList.add('show');
        document.getElementById('walletText').textContent = `${balance.toLocaleString()} / ${limit.toLocaleString()}`;
        document.getElementById('walletFill').style.width = `${Math.min(100, (balance / limit) * 100)}%`;
        document.getElementById('walletNotice').textContent = balance ? 'ใช้ได้จนกว่าเครดิตจะหมด แล้วเติมเพิ่มได้จากหน้า Usage' : 'เครดิตหมดแล้ว กรุณาเติม token เพิ่ม';
      }
    }

    document.getElementById('saveProfile').onclick = async () => {
      const status = document.getElementById('profileStatus');
      const body = { email: document.getElementById('emailInput').value.trim(), currentPassword: document.getElementById('currentPassword').value, newPassword: document.getElementById('newPassword').value, newPasswordConfirm: document.getElementById('newPasswordConfirm').value };
      if (body.newPassword && !body.currentPassword) { status.textContent = 'กรุณาใส่ password ปัจจุบัน'; return; }
      const response = await fetch('/v1/profile', { method: 'PATCH', headers, body: JSON.stringify(body) });
      const result = await response.json();
      status.textContent = response.ok ? 'บันทึกข้อมูลแล้ว' : (result.error || 'บันทึกไม่สำเร็จ');
      if (response.ok) { document.getElementById('currentPassword').value = ''; document.getElementById('newPassword').value = ''; document.getElementById('newPasswordConfirm').value = ''; document.getElementById('accountNotice').textContent = ''; }
    };

    async function loadUsageLimit() {
      const response = await fetch('/v1/usage', { headers: { 'x-api-key': apiKey } });
      if (!response.ok) return;
      const usage = await response.json();
      const dailyPct = usage.limits.dailyBudgetUSD ? Math.min(100, usage.today.usedUSD / usage.limits.dailyBudgetUSD * 100) : 0;
      const monthlyPct = usage.limits.monthlyBudgetUSD ? Math.min(100, usage.thisMonth.usedUSD / usage.limits.monthlyBudgetUSD * 100) : 0;
      document.getElementById('dailyUsage').textContent = `$${usage.today.usedUSD} / $${usage.limits.dailyBudgetUSD}`;
      document.getElementById('monthlyUsage').textContent = `$${usage.thisMonth.usedUSD} / $${usage.limits.monthlyBudgetUSD}`;
      document.getElementById('dailyFill').style.width = `${dailyPct}%`;
      document.getElementById('monthlyFill').style.width = `${monthlyPct}%`;
    }

    init().then(loadUsageLimit).catch((error) => { statusElement.textContent = error.message || 'Unable to load account data.'; });
  </script>
</body>
</html>
