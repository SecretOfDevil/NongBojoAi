<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model status</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#14161b;color:#ece9e1;font:15px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px}a{color:#f0a93b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:20px}.card{background:#1b1e25;border:1px solid #2b2f3a;border-radius:10px;padding:16px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:#e85d4c}.online .dot{background:#5fbf87}.state{font:700 12px monospace;color:#ff9c91}.online .state{color:#5fbf87}.muted{color:#9ca3b0}.owned{border-color:#f0a93b}</style></head><body><main class="wrap"><a href="/index.html">กลับหน้าแชท</a><h1>Model status</h1><p class="muted">สถานะล่าสุดของ model และสิทธิ์ที่คุณซื้อผ่าน top-up</p><div id="models" class="grid">กำลังโหลด...</div></main><script>const key=localStorage.getItem('claudeProxyApiKey');if(!key)location.href='/login.html';async function load(){const r=await fetch('/v1/model-status',{headers:{'x-api-key':key}}),d=await r.json();if(!r.ok){document.getElementById('models').textContent=d.error||'โหลดไม่สำเร็จ';return}const owned=new Set(d.purchasedModels||[]);document.getElementById('models').innerHTML=d.models.map(m=>`<article class="card ${m.online?'online':''} ${owned.has(m.provider+'/'+m.model)?'owned':''}"><h3><span class="dot"></span>${m.provider} / ${m.model}</h3><div class="state">${m.online?'ONLINE':'OFFLINE'}</div>${owned.has(m.provider+'/'+m.model)?'<p>ซื้อผ่าน top-up แล้ว ใช้ได้โดยไม่ขึ้นกับ plan</p>':''}</article>`).join('')}load().catch(()=>{});setInterval(load,30000)</script></body></html>
